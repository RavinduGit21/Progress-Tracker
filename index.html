<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="toolbar">
            <h1>Progress Tracker</h1>
            <div id="clock" class="clock"></div>
            <div class="actions">
                <button id="add-row" title="Add row">+ Row</button>
                <button id="add-col" title="Add column">+ Column</button>
                <button id="reset" title="Clear all checks">Reset</button>
                <span class="muted" style="margin-left:12px">Zoom:</span>
                <button id="zoom-out" title="Zoom out">−</button>
                <button id="zoom-in" title="Zoom in">+</button>
                <button id="zoom-reset" title="Reset zoom">100%</button>
            </div>
        </header>

        <div class="exam-countdown">
            <p id="countdown-1"></p>
            <p id="countdown-2"></p>
            <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
        </div>

        <div class="table-wrap">
            <table id="tracker" aria-label="Progress tracker table"></table>
        </div>

        <footer class="hint">
            <p>
                Tip: Double‑click any row or column name to edit. Click a cell to toggle a check ✔.
                Data is saved automatically in your browser.
            </p>
        </footer>
    </div>

    <div id="settings-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Countdown Settings</h2>
            <form id="settings-form">
                <div class="form-group">
                    <label for="countdown1-text">Countdown 1 Text</label>
                    <input type="text" id="countdown1-text" required>
                </div>
                <div class="form-group">
                    <label for="countdown1-date">Countdown 1 Date</label>
                    <input type="date" id="countdown1-date" required>
                </div>
                <hr>
                <div class="form-group">
                    <label for="countdown2-text">Countdown 2 Text</label>
                    <input type="text" id="countdown2-text" required>
                </div>
                <div class="form-group">
                    <label for="countdown2-date">Countdown 2 Date</label>
                    <input type="date" id="countdown2-date" required>
                </div>
                <button type="submit">Save</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <!--
      This app stores data in localStorage under the key 'progress-tracker-v1'.
    -->
</body>
</html>
